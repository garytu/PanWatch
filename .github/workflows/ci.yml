# 回歸測試:PR 與 main push 的預設閘門。
# 只在相關檔案變更時跑;純文件/圖片 PR 不觸發。
name: Application regression

on:
  pull_request:
    paths:
      - 'src/**'
      - 'server.py'
      - 'packages/**'
      - 'tests/**'
      - 'frontend/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'Makefile'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'server.py'
      - 'packages/**'
      - 'tests/**'
      - 'frontend/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'Makefile'
      - '.github/workflows/ci.yml'
  # 手動觸發用於驗證 workflow 本身,或對指定分支補跑回歸。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # 與 frontend/package.json 的 packageManager 及 Dockerfile 一致
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          # 與 .nvmrc 及 Dockerfile(node:24.14.0-alpine)一致
          node-version: 24.14.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run frontend unit tests
        run: pnpm run test --run
      - name: Build frontend (tsc -b && vite build)
        run: pnpm build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 與 Dockerfile 執行期(python:3.11-slim)與 release 測試一致
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install system libs for WeasyPrint (PDF export tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libpangoft2-1.0-0 \
            libcairo2 libcairo-gobject2 libgdk-pixbuf-2.0-0 \
            libffi-dev libfontconfig1 fonts-noto-cjk
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run backend tests
        run: python -m pytest tests/ -q
      - name: Run workspace package tests
        run: |
          set -euo pipefail
          for package in packages/*; do
            if [ -d "$package/tests" ]; then
              echo "::group::${package}"
              python -m pytest "${package}/tests" -q
              echo "::endgroup::"
            fi
          done
