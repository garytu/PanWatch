# pytest 配置
# 執行全部單測：        python -m pytest tests/ -v
# 執行單個檔案：        python -m pytest tests/test_notify_policy.py -v
# 實際傳送通知：        python -m pytest tests/ -v --notify （預設不發通知）
# 安裝 pre-push hook： bash scripts/install-hooks.sh

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
